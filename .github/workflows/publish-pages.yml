name: Publish Web build to GitHub Pages

# O Godot headless (--editor --quit/--quit-after) não importa nenhum asset
# binário (PNG/MP3) no runner do GitHub Actions — sai com exit 0 e 0
# arquivos importados, sem nenhum erro, mesmo dando minutos de processamento
# e testando várias combinações de --display-driver/--rendering-driver.
# Localmente (mesma versão do Godot, mesmo projeto) o export funciona
# perfeitamente. Enquanto a causa exata dessa diferença não é encontrada,
# publicamos o build gerado localmente: ele é enviado como assets de uma
# release chamada "web-build" (veja README da release) e este workflow só
# baixa esses arquivos prontos e publica no Pages — sem rodar o Godot aqui.
#
# Para atualizar o site depois de mudar assets/cenas: exporte localmente
# (Godot > Project > Export > Web) e suba os arquivos exportados (index.*)
# como assets da release "web-build", substituindo os antigos. Este
# workflow roda de novo sozinho a cada push em main.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sem gatilho "release: published": o ambiente github-pages tem uma regra
  # de proteção que só permite deploy vindo da branch main, e o evento de
  # release dispara com a ref da tag (ex.: refs/tags/web-build), que é
  # rejeitada ("Tag ... is not allowed to deploy to github-pages due to
  # environment protection rules"). Depois de subir uma release nova, dispare
  # o deploy com um push em main (ou "Run workflow" manual).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WEB_BUILD_TAG: web-build
  WEB_BUILD_FILES: >-
    index.html index.js index.pck index.wasm index.png index.icon.png
    index.apple-touch-icon.png index.audio.worklet.js
    index.audio.position.worklet.js

jobs:
  fetch:
    name: Fetch pre-built Web export
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/web"
          mkdir -p "$dir"
          base="https://github.com/${{ github.repository }}/releases/download/${WEB_BUILD_TAG}"
          for f in $WEB_BUILD_FILES; do
            curl -fL --retry 3 --retry-delay 2 "$base/$f" -o "$dir/$f"
          done
          test -s "$dir/index.html"
          test -s "$dir/index.pck"
          find "$dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/web

  deploy:
    name: Deploy to GitHub Pages
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
